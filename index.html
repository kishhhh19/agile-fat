<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Disaster Coordination Portal</title>
    <link href="https://cloudflare.com" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 p-6">
    <header class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
        <h1 class="text-xl font-bold text-red-500">⚠️ Disaster Resource Coordination Portal</h1>
        <select id="filter" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm">
            <option value="ALL">All Levels</option><option value="Critical">Critical</option>
            <option value="High">High</option><option value="Medium">Medium</option>
        </select>
    </header>

    <div id="alert-banner" class="hidden bg-red-600 text-white font-bold p-3 rounded mb-6 animate-pulse">
        🚨 CRITICAL ALERT: Evacuation Centre occupancy exceeds 90%! Rerouting inbound teams.
    </div>

    <!-- Analytics Dashboard Overview -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-gray-800 p-3 rounded border border-gray-700">Open Incidents: <span id="s-open" class="font-bold text-yellow-500">0</span></div>
        <div class="bg-gray-800 p-3 rounded border border-gray-700">Resolved: <span id="s-res" class="font-bold text-green-400">0</span></div>
        <div class="bg-gray-800 p-3 rounded border border-gray-700">Rescue Teams: <span class="font-bold text-blue-400">4</span></div>
        <div class="bg-gray-800 p-3 rounded border border-gray-700">Shortages: <span id="s-repl" class="font-bold text-red-400">0</span></div>
    </section>

    <!-- Priority Hub -->
    <section id="priority-box" class="hidden bg-red-950 border border-red-700 p-4 rounded mb-6">
        <h2 class="font-bold text-white text-sm uppercase">🔥 Highest Priority Incident Triage</h2>
        <p id="p-desc" class="text-sm mt-1 text-gray-300"></p>
        <div id="p-alloc" class="text-xs font-mono mt-2 p-2 bg-black rounded"></div>
    </section>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 bg-gray-800 p-4 rounded border border-gray-700 overflow-x-auto">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead><tr class="text-gray-400 border-b border-gray-700"><th class="p-2">ID</th><th class="p-2">Location</th><th class="p-2">Category</th><th class="p-2">Severity</th><th class="p-2">Team</th><th class="p-2">Status</th></tr></thead>
                <tbody id="incidents-body"></tbody>
            </table>
        </div>
        <div class="bg-gray-800 p-4 rounded border border-gray-700"><h2 class="font-bold mb-3 text-gray-200">Evacuation Centres</h2><div id="centres-box" class="space-y-3"></div></div>
    </div>

    <button onclick="simulateStep()" class="mt-6 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white text-sm shadow font-medium">🔄 Run Simulation Update</button>

    <script>
        let incidents = [
            { id: "INC-01", loc: "River Banks Side", cat: "Flash Flood", sev: "Critical", team: "NDRF Alpha", status: "Open" },
            { id: "INC-02", loc: "North Highway", cat: "Landslide", sev: "High", team: "SDRF Bravo", status: "Open" },
            { id: "INC-03", loc: "Downtown C", cat: "Grid Failure", sev: "Medium", team: "Civil Defense", status: "Open" },
            { id: "INC-04", loc: "Old Town Bridge", cat: "Structural Leak", sev: "Critical", team: "Unassigned - En Route", status: "Open" },
            { id: "INC-05", loc: "Fishing Hamlet", cat: "High Tide Surge", sev: "High", team: "Coast Guard", status: "Resolved" }
        ];

        let centres = [
            { name: "Model School", cap: 500, occ: 465, supply: "Adequate Supply", short: false },
            { name: "Community Hall", cap: 300, occ: 285, supply: "Water Shortage", short: true },
            { name: "Sports Complex", cap: 1200, occ: 420, supply: "Adequate Medical", short: false }
        ];

        function render() {
            const filter = document.getElementById('filter').value;
            
            // Analytics counts
            document.getElementById('s-open').innerText = incidents.filter(i => i.status === 'Open').length;
            document.getElementById('s-res').innerText = incidents.filter(i => i.status === 'Resolved').length;
            document.getElementById('s-repl').innerText = centres.filter(c => c.short).length;

            // Render table
            const tbody = document.getElementById('incidents-body'); tbody.innerHTML = '';
            incidents.filter(i => filter === 'ALL' || i.sev === filter).forEach(i => {
                tbody.innerHTML += `<tr class="border-b border-gray-700 hover:bg-gray-700"><td class="p-2 font-mono text-gray-400">${i.id}</td><td class="p-2 font-medium">${i.loc}</td><td class="p-2">${i.cat}</td><td class="p-2 text-xs font-bold ${i.sev==='Critical'?'text-red-400':'text-yellow-400'}">${i.sev}</td><td class="p-2 font-mono">${i.team}</td><td class="p-2 ${i.status==='Open'?'text-yellow-500':'text-green-400'}">${i.status}</td></tr>`;
            });

            // Render evacuation centres & global overcrowding capacity flag (>90%)
            let over90 = false;
            const cBox = document.getElementById('centres-box'); cBox.innerHTML = '';
            centres.forEach(c => {
                let rate = ((c.occ / c.cap) * 100).toFixed(0);
                if (rate > 90) over90 = true;
                cBox.innerHTML += `<div class="p-3 rounded border ${rate>90?'bg-red-950 border-red-500':'bg-gray-900 border-gray-700'}"><div class="flex justify-between text-xs font-bold"><span>${c.name}</span><span>${rate}%</span></div><div class="text-xs text-gray-400 mt-1">Available: ${c.cap - c.occ} | ${c.supply}</div></div>`;
            });
            document.getElementById('alert-banner').className = over90 ? "bg-red-600 text-white font-bold p-3 rounded mb-6 text-sm" : "hidden";

            // Prioritize highest alert status
            const topCrit = incidents.find(i => i.sev === 'Critical' && i.status === 'Open');
            const pBox = document.getElementById('priority-box');
            if (topCrit) {
                pBox.classList.remove('hidden');
                document.getElementById('p-desc').innerText = `${topCrit.loc} - ${topCrit.cat}`;
                document.getElementById('p-alloc').className = topCrit.team.includes('Unassigned') ? "text-red-400 font-bold text-xs" : "text-green-400 text-xs";
                document.getElementById('p-alloc').innerText = topCrit.team.includes('Unassigned') ? "⚠️ RESOURCE SHORTAGE: Rescue unit dispatch required." : `⚡ Assigned to: ${topCrit.team}`;
            } else { pBox.classList.add('hidden'); }
        }

        function simulateStep() {
            const unassigned = incidents.find(i => i.team.includes('Unassigned'));
            if (unassigned) unassigned.team = "NDRF Taskforce Echo";
            else { incidents[3].team = "Unassigned - En Route"; centres[0].occ = 465; } // toggle loop loopback
            render();
        }

        document.getElementById('filter').addEventListener('change', render);
        window.onload = render;
    </script>
</body>
</html>
