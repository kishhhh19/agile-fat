apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: disaster-portal
  template:
    metadata:
      labels:
        app: disaster-portal
    spec:
      containers:
      - name: app
        image: disaster/portal:TAG_PLACEHOLDER
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 3
        livenessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-portal-srv
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: disaster-portal
